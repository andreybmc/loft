listen: ":443"
cert: /etc/loft/fullchain.pem
key: /etc/loft/privkey.pem
token: "change-me-long-random"

# Optional real website root. Empty = built-in cover page.
cover_dir: ""

get_path: /static/js
ws_path: /api/v1/sync
h2_path: /api/v1/tunnel
h3_path: /api/v1/tunnel

# fronts: leave empty for all. Drop a name to disable it on this node.
# fronts: [get, ws, h2, quic, h3]

# decoy: this node's identity. Unauthorized ClientHello is spliced here
# (an active probe sees that origin's live TLS). First entry is what the
# node "is" — the client learns it from Status and uses that SNI.
# Another node would list a different origin (e.g. online.sberbank.ru:443).
# Empty list = off.
decoy:
  - www.gosuslugi.ru:443

# mask: loft TLS wears the origin certificate (probes still splice).
mask: true

role: controller
advertise: https://controller.example
roster_path: /static/v3/manifest.json
lists_path: /static/v3/lists.json

# named address lists; the client maps names to direct/via/drop
# lists:
#   sber:
#     - sberbank.ru
#     - .sber.ru
#   youtube:
#     - youtube.com
#     - .googlevideo.com
#   direct:
#     - .ru
#   drop:
#     - ads.example

# relays: allowlist for enrol (id must match). Live roster = advertise + heartbeats.
enrol: list
# relays:
#   - id: ru1
#     url: https://203.0.113.10
#     decoy: www.gosuslugi.ru:443
#     fronts: [get, ws, h2]
#     weight: 100

# extra node addresses the client may fail over to (host:port, unsigned)
# replicas:
#   - 203.0.113.10:443

# quic_alpn: h3   # default; do not use "loft"

# dpi: optional extra cost for a reassembling middlebox. Does not hide SNI.
dpi:
  fat_hello: true    # Chrome-sized ClientHello (default)
  split_hello: false # two TLS records for ClientHello; node reassembles
  pad: 0             # extra padding bytes, 0–2048
